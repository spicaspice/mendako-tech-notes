<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mendako tech notes</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f1e8;
      --panel: rgba(255, 252, 246, 0.9);
      --line: #d7c7ad;
      --text: #2b241d;
      --muted: #6d6256;
      --accent: #b45309;
      --accent-soft: #fff1db;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 231, 179, 0.8), transparent 32%),
        linear-gradient(180deg, #fbf7ef 0%, var(--bg) 100%);
    }

    main {
      width: min(860px, calc(100% - 32px));
      margin: 48px auto;
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(98, 72, 35, 0.12);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .meta {
      display: inline-flex;
      margin-top: 18px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .section-title {
      margin: 40px 0 16px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-transform: uppercase;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 14px;
    }

    li {
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.72);
    }

    a.article {
      display: block;
      padding: 18px 20px;
      color: inherit;
      text-decoration: none;
      transition: transform 160ms ease, background-color 160ms ease;
    }

    a.article:hover {
      transform: translateY(-1px);
      background: #fffaf1;
    }

    .article-title {
      display: block;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .article-meta {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .status {
      padding: 18px 20px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.5);
    }

    @media (max-width: 640px) {
      main {
        margin: 20px auto;
        padding: 22px;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>mendako tech notes</h1>
    <p>気になった技術メモを、ゆるく積み上げていくための小さな置き場。</p>
    <div class="meta">auto index from GitHub repo</div>

    <div class="section-title">Articles</div>
    <div id="status" class="status">記事一覧を読み込み中...</div>
    <ul id="articles" hidden></ul>
  </main>

  <script>
    const owner = "spicaspice";
    const repo = "mendako-tech-notes";
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/`;

    const statusEl = document.getElementById("status");
    const listEl = document.getElementById("articles");

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatDateFromName(name) {
      const match = name.match(/^(\d{4})-(\d{2})-(\d{2})-/);
      if (!match) return "date unknown";
      return `${match[1]}-${match[2]}-${match[3]}`;
    }

    function fallbackTitle(name) {
      return name
        .replace(/^\d{4}-\d{2}-\d{2}-/, "")
        .replace(/\.md$/, "")
        .replace(/-/g, " ");
    }

    function articleUrl(name) {
      return `https://${owner}.github.io/${repo}/${name.replace(/\.md$/, ".html")}`;
    }

    async function fetchTitle(downloadUrl, name) {
      try {
        const response = await fetch(downloadUrl);
        if (!response.ok) throw new Error(`raw fetch failed: ${response.status}`);
        const text = await response.text();
        const heading = text.match(/^#\s+(.+)$/m);
        return heading ? heading[1].trim() : fallbackTitle(name);
      } catch {
        return fallbackTitle(name);
      }
    }

    async function loadArticles() {
      try {
        const response = await fetch(apiUrl, {
          headers: {
            Accept: "application/vnd.github+json"
          }
        });
        if (!response.ok) throw new Error(`api fetch failed: ${response.status}`);

        const items = await response.json();
        const markdownFiles = items
          .filter((item) => item.type === "file")
          .filter((item) => item.name.endsWith(".md"))
          .filter((item) => item.name !== "README.md")
          .sort((a, b) => b.name.localeCompare(a.name, "en"));

        if (markdownFiles.length === 0) {
          statusEl.textContent = "まだ記事がありません。";
          return;
        }

        const articles = await Promise.all(markdownFiles.map(async (item) => ({
          name: item.name,
          title: await fetchTitle(item.download_url, item.name)
        })));

        listEl.innerHTML = articles.map((article) => `
          <li>
            <a class="article" href="${escapeHtml(articleUrl(article.name))}">
              <span class="article-title">${escapeHtml(article.title)}</span>
              <span class="article-meta">${escapeHtml(formatDateFromName(article.name))}</span>
            </a>
          </li>
        `).join("");

        statusEl.hidden = true;
        listEl.hidden = false;
      } catch (error) {
        statusEl.textContent = "記事一覧の取得に失敗しました。少し待って再読み込みしてください。";
      }
    }

    loadArticles();
  </script>
</body>
</html>
